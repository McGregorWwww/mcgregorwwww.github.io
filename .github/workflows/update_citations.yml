name: Update Google Scholar Citations

on:
  schedule:
    # Runs every 6 hours (at 00:00, 06:00, 12:00, and 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:  # Allows manual triggering

jobs:
  update-citations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r google_scholar_crawler/requirements.txt

      - name: Run citation crawler
        env:
          GOOGLE_SCHOLAR_ID: KDNRnW0AAAAJ
        run: |
          python google_scholar_crawler/main.py
          
      - name: Commit and push if changed
        run: |
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git add results/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update citation data [automated]"
            git push "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:${{ github.ref }}
          fi
