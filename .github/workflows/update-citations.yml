name: Update Citation Data

on:
  schedule:
    # Run on the 1st of every month at midnight
    - cron: '0 0 1 * *'
  workflow_dispatch:  # Allow manual triggering

jobs:
  update_citations:
    runs-on: ubuntu-latest
    timeout-minutes: 15  # Increased timeout to handle proxy retries
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install scholarly requests jsonpickle
          
      - name: Run Google Scholar crawler
        env:
          GOOGLE_SCHOLAR_ID: KDNRnW0AAAAJ  # Your Google Scholar ID
        run: |
          mkdir -p google_scholar_crawler/results
          cd google_scholar_crawler
          python main.py
          
      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add google_scholar_crawler/results/
          # Only commit if there are changes
          git diff --staged --quiet || (git commit -m "Update citation data from Google Scholar" && git push)
          
      - name: Check for failure
        if: failure()
        run: |
          echo "The Google Scholar crawler failed. This might be due to rate limiting or proxy issues."
          echo "Try running it again manually later or check the logs for more details."
        # Continue on error to prevent workflow failure if push fails
        continue-on-error: true
