name: Update citation and star counts

# Refreshes google-scholar-stats/citations.json, which holds two independent
# halves that are deliberately refreshed on very different schedules:
#
#   * stars -- GitHub REST API. Cheap, generous rate limit (1000/hr with the
#     Actions token), needs no scraping. Runs several times a day (below).
#   * citations -- a scrape of the public Scholar profile. This is the fragile
#     half: run it on a short interval and the Actions IP gets captcha'd, after
#     which citation counts stop updating at all. Runs weekly.
#
# Running one job on one schedule used to mean the star counts were also only
# as fresh as the monthly scrape, for no reason.
#
# Why weekly, and why the retry below (changed 2026-11-15): the citations job
# used to run on the 1st of the month only, and it had no second chance. It
# failed on 2026-11-01 (Scholar captcha'd the runner, which is the documented
# risk above) and the counts then sat at their 2026-10-16 values for six weeks
# -- the next attempt was not due until 2026-12-01. Reviewing the history, that
# job had never once succeeded: no "Update Google Scholar citation counts"
# commit existed. Meanwhile the star job kept committing every few hours, so
# the file looked live while half of it was stale.
#
# Two independent fixes, because the failure had two causes:
#   * weekly, not monthly -- a bad week costs 7 days instead of ~30;
#   * retry within the run, on the theory that the block was a captcha.
# Weekly is still far below the rate that gets an IP blocked; the fragile-half
# warning is about hourly polling, not about seven scrapes in two months.
#
# The retry half of that was wrong, and was removed on 2026-11-24. The runners
# do not get a captcha, they get a flat HTTP 403: the block is on the Actions
# egress range, not on a session, so waiting changes nothing and the sleeps
# only held a runner long enough to queue the following run behind it. What a
# 403 needs is a different exit address -- see the fetch step below.
#
# Why the JSON lives here at all:
#   * GitHub Pages serves google-scholar-stats/ as a plain static file from the
#     same origin as the site, so the page needs no CORS dance and no
#     third-party CDN. The earlier setup pointed at
#     cdn.jsdelivr.net/...@google-scholar-stats/... but that branch never
#     existed, so every citation badge was silently 404ing.
#   * If Scholar rate-limits us the script exits non-zero and the job fails
#     loudly instead of committing an empty file over good data.

on:
  schedule:
    # Stars: 4x/day. Off minute 0 to avoid the top-of-hour scheduler crunch,
    # which is when scheduled runs are most likely to be delayed or dropped.
    - cron: '23 */6 * * *'
    # Citations: Sundays, 06:17 UTC. The job keys off this exact string, so
    # editing it here means editing the `if:` on the citations job too.
    - cron: '17 6 * * 0'
  workflow_dispatch:
    inputs:
      mode:
        description: 'What to refresh'
        type: choice
        options: [stars-only, everything]
        default: stars-only

permissions:
  contents: write

# One writer at a time. Both jobs commit the same file, and a concurrent run
# would otherwise race the other's push.
concurrency:
  group: update-citations
  cancel-in-progress: false

jobs:
  stars:
    # On a schedule, the 6-hourly cron selects this job; the monthly cron is
    # handled by the citations job below. A manual run picks via `mode`.
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.mode == 'stars-only'
      || github.event_name == 'schedule' && github.event.schedule == '23 */6 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # No third-party packages: the fetcher is stdlib-only on purpose.
      # The old job installed `scholarly`, which pulls rotating proxies that
      # break constantly and fail silently.
      - name: Refresh star counts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUT: ../google-scholar-stats/citations.json
        working-directory: google_scholar_crawler
        run: python fetch_citations.py --stars-only

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add google-scholar-stats/citations.json
          if git diff --staged --quiet; then
            echo "No change in star counts."
          else
            git commit -m "Update GitHub star counts"
            git push
          fi

      # The same gate runs at the end of the citations job, but a gate that
      # only runs inside the job it is watching cannot report that job never
      # starting -- which is exactly how this broke: a stale `if:` on the
      # citations job would silence it completely. This job runs 4x/day off a
      # separate cron, so it notices within hours either way.
      - name: Warn if the citation counts are going stale
        if: always()
        run: python google_scholar_crawler/check_freshness.py

  citations:
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.mode == 'everything'
      || github.event_name == 'schedule' && github.event.schedule == '17 6 * * 0'
    runs-on: ubuntu-latest
    # Back to 15 now that the 35 minutes of retry sleeps are gone. A run that
    # cannot finish in this long is stuck, and holding the runner only delays
    # the next scheduled run behind it -- which is how one weekly run ended up
    # queued for 36 hours.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Full mode re-reads Scholar and refreshes stars in the same pass, so the
      # two halves can never drift apart by more than the star job's interval.
      #
      # The 5/10/20-minute retry loop that used to be here is gone. It was
      # written for a captcha -- transient, lifts if you wait -- but what the
      # runners actually get is a flat HTTP 403: Google blocks the Actions
      # egress range outright, so every attempt from the same runner returns
      # the same 403 no matter how long it waits. The loop's only effect was
      # to hold a runner for 35 minutes and queue the next scheduled run
      # behind it; one weekly run sat queued for 36 hours because of it. The
      # script keeps its own short backoff for the failures that *are*
      # transient, and now exits immediately on 403.
      #
      # SCRAPER_URL is the way out: an endpoint template that fetches the URL
      # from an address Google will answer (see fetch_citations.py's header for
      # the shape, and the secret's value for which vendor). HTTPS_PROXY works
      # too and needs no code -- urllib reads it on its own. Both are optional:
      # unset, this behaves as it always did and simply fails on 403, which is
      # the honest outcome when there is no route to Scholar.
      #
      # The script writes the output file only after a successful parse, so a
      # failed attempt cannot leave a truncated or empty JSON behind.
      - name: Fetch citations and stars
        env:
          GOOGLE_SCHOLAR_ID: KDNRnW0AAAAJ
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUT: ../google-scholar-stats/citations.json
          SCRAPER_URL: ${{ secrets.SCRAPER_URL }}
          HTTPS_PROXY: ${{ secrets.SCHOLAR_HTTPS_PROXY }}
        working-directory: google_scholar_crawler
        run: |
          if [ -z "${SCRAPER_URL}${HTTPS_PROXY}" ]; then
            echo "::warning::Neither SCRAPER_URL nor SCHOLAR_HTTPS_PROXY is" \
                 "set. Google 403s the Actions runners, so this will probably" \
                 "fail; see this workflow's comments."
          fi
          python fetch_citations.py

      - name: Show the result
        run: |
          echo '--- google-scholar-stats/citations.json ---'
          head -c 400 google-scholar-stats/citations.json
          echo

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add google-scholar-stats/citations.json
          if git diff --staged --quiet; then
            echo "No change in citation counts."
          else
            git commit -m "Update Google Scholar citation counts"
            git push
          fi

      # Catches the case this job ran but could not commit anything useful.
      # The age is computed in Python, not with `date -u -d`: that spelling
      # needs GNU date, so it works on the runner but cannot be tested on a
      # BSD-date machine like the one this is edited from. See the script for
      # why `updated` is the right field to measure.
      - name: Warn if the counts are going stale
        if: always()
        run: python google_scholar_crawler/check_freshness.py
