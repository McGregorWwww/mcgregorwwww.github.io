name: Update citation and star counts

# Refreshes google-scholar-stats/citations.json, which holds two independent
# halves that are deliberately refreshed on very different schedules:
#
#   * stars -- GitHub REST API. Cheap, generous rate limit (1000/hr with the
#     Actions token), needs no scraping. Runs several times a day (below).
#   * citations -- a scrape of the public Scholar profile. This is the fragile
#     half: run it on a short interval and the Actions IP gets captcha'd, after
#     which citation counts stop updating at all. Runs monthly.
#
# Running one job on one schedule used to mean the star counts were also only
# as fresh as the monthly scrape, for no reason.
#
# Why the JSON lives here at all:
#   * GitHub Pages serves google-scholar-stats/ as a plain static file from the
#     same origin as the site, so the page needs no CORS dance and no
#     third-party CDN. The earlier setup pointed at
#     cdn.jsdelivr.net/...@google-scholar-stats/... but that branch never
#     existed, so every citation badge was silently 404ing.
#   * If Scholar rate-limits us the script exits non-zero and the job fails
#     loudly instead of committing an empty file over good data.

on:
  schedule:
    # Stars: 4x/day. Off minute 0 to avoid the top-of-hour scheduler crunch,
    # which is when scheduled runs are most likely to be delayed or dropped.
    - cron: '23 */6 * * *'
    # Citations: 1st of the month, 06:17 UTC.
    - cron: '17 6 1 * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'What to refresh'
        type: choice
        options: [stars-only, everything]
        default: stars-only

permissions:
  contents: write

# One writer at a time. Both jobs commit the same file, and a concurrent run
# would otherwise race the other's push.
concurrency:
  group: update-citations
  cancel-in-progress: false

jobs:
  stars:
    # On a schedule, the 6-hourly cron selects this job; the monthly cron is
    # handled by the citations job below. A manual run picks via `mode`.
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.mode == 'stars-only'
      || github.event_name == 'schedule' && github.event.schedule == '23 */6 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # No third-party packages: the fetcher is stdlib-only on purpose.
      # The old job installed `scholarly`, which pulls rotating proxies that
      # break constantly and fail silently.
      - name: Refresh star counts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUT: ../google-scholar-stats/citations.json
        working-directory: google_scholar_crawler
        run: python fetch_citations.py --stars-only

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add google-scholar-stats/citations.json
          if git diff --staged --quiet; then
            echo "No change in star counts."
          else
            git commit -m "Update GitHub star counts"
            git push
          fi

  citations:
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.mode == 'everything'
      || github.event_name == 'schedule' && github.event.schedule == '17 6 1 * *'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Full mode re-reads Scholar and refreshes stars in the same pass, so the
      # two halves can never drift apart by more than the star job's interval.
      - name: Fetch citations and stars
        env:
          GOOGLE_SCHOLAR_ID: KDNRnW0AAAAJ
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUT: ../google-scholar-stats/citations.json
        working-directory: google_scholar_crawler
        run: python fetch_citations.py

      - name: Show the result
        run: |
          echo '--- google-scholar-stats/citations.json ---'
          head -c 400 google-scholar-stats/citations.json
          echo

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add google-scholar-stats/citations.json
          if git diff --staged --quiet; then
            echo "No change in citation counts."
          else
            git commit -m "Update Google Scholar citation counts"
            git push
          fi
