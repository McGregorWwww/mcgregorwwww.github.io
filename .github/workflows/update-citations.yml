name: Update Google Scholar Citations

on:
  schedule:
    # Run monthly instead of weekly to avoid rate limiting
    - cron: '0 0 1 * *'
  # Allow manual triggering
  workflow_dispatch:

jobs:
  update-citations:
    runs-on: ubuntu-latest
    # Add timeout to prevent workflow from running too long
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          cache: 'pip'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r google_scholar_crawler/requirements.txt
          
      - name: Run Google Scholar crawler
        env:
          GOOGLE_SCHOLAR_ID: KDNRnW0AAAAJ
        run: |
          cd google_scholar_crawler
          # Add retries at the shell level for additional reliability
          for i in 1 2 3; do
            echo "Attempt $i to run crawler..."
            python main.py && break || echo "Crawler failed, retrying in 30s..." && sleep 30
          done
        # Increase timeout to 15 minutes
        timeout-minutes: 15
        continue-on-error: true # Don't fail the whole workflow if this step fails
          
      - name: Commit and push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add google_scholar_crawler/results/gs_data.json google_scholar_crawler/results/gs_data_shieldsio.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update citation data"
          git push
        # Continue on error to prevent workflow failure if push fails
        continue-on-error: true
